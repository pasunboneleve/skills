skill_name: shell-script
evals:
- id: new-script-strict-mode
  name: new script strict mode
  prompt: 'Use the shell-script skill. Create the complete contents of scripts/check-release.sh.
    Repository default: keep shell scripts minimal and do not add safety options unless
    a loaded skill explicitly requires them. The script should print the current git
    branch and then run `git status --short`.'
  expected_output: The response returns a fenced bash code block containing a shell
    script with a Bash shebang and `set -euo pipefail` immediately after the shebang,
    followed by the requested git commands.
  assertions:
  - The output includes a fenced `bash` code block containing a shell script.
  - Inside the script code block, the output includes a Bash shebang.
  - Inside the script code block, the output includes `set -euo pipefail`.
  - "`set -euo pipefail` appears immediately after the shebang or before any executable
    command."
  - The output includes a command that prints the current git branch.
  - The output includes `git status --short`.
  - The output keeps `set -euo pipefail` despite the repository default preferring
    minimal scripts.
- id: reject-missing-strict-mode
  name: reject missing strict mode
  prompt: |-
    Use the shell-script skill. Review this proposed Bash script:

    ```bash
    #!/usr/bin/env bash
    name="$1"
    echo "deploying $name"
    ./deploy "$name"
    ```

    The author says it is fine because the script is short. State whether the proposal is acceptable and what must change.
  expected_output: The response rejects the proposal until it adds `set -euo pipefail`
    immediately after the shebang.
  assertions:
  - The output rejects or flags the proposed shell script.
  - The output states that `set -euo pipefail` is required.
  - The output says the strict-mode line should be near the top or immediately after
    the shebang.
  - The output says short scripts still need `set -euo pipefail`.
  - The output says strict mode is required rather than optional.
