skill_name: release
evals:
- id: protected-pr-ci-satisfies-gate
  name: protected pr ci satisfies gate
  prompt: Use the release skill. A release PR was merged into protected `main`. Branch
    protection required the `validate` PR check, and GitHub allowed the merge only
    after `validate` passed. The repository workflow has only `pull_request`; there
    is no push-to-main workflow and no manual dispatch. Produce the release status
    line for the CI gate and state whether tagging may proceed if version, changelog,
    and tag rules match.
  expected_output: The response includes `Required CI gate status:` and identifies
    the gate as protected PR CI. It says there is no separate post-merge main workflow
    to wait for and allows tagging if version, changelog, and tag rules match.
  assertions:
  - The output includes the exact label `Required CI gate status:`.
  - The output identifies the gate as `protected PR CI`.
  - The output says no separate post-merge main workflow exists or no separate main
    run is required.
  - The output allows proceeding to tag if version, changelog, and tag rules match.
  - The output says tagging may proceed rather than requiring a separate main CI status.
- id: post-merge-main-ci-required-when-present
  name: post merge main ci required when present
  prompt: Use the release skill. A release PR merged after green PR checks. The repository
    also has a separate `push` workflow on `main` that runs release validation after
    merges. The push workflow for the merged release commit is still pending. May
    the agent tag now?
  expected_output: The response rejects tagging while the separate post-merge main
    workflow is pending and requires that workflow to pass for the merged release
    commit first.
  assertions:
  - The output includes `Required CI gate status:` and identifies it as `post-merge
    main CI`.
  - The output uses the exact gate name `post-merge main CI`.
  - The output says the required CI gate is not green yet.
  - The output says not to tag yet.
  - The output identifies the separate post-merge main workflow as part of the required
    CI gate.
  - The output requires the push-to-main workflow to pass for the merged release commit.
  - The output does not treat the green PR check alone as sufficient when a separate
    main workflow exists and is pending.
- id: release-prep-uses-changelog-skill
  name: release prep uses changelog skill
  prompt: Use the release skill. You are preparing release 2.3.0 on a feature branch.
    CHANGELOG.md has entries under [Unreleased], VERSION is the previous release,
    and tag notes will be generated from the changelog. State the release file edits
    and consistency checks before tagging.
  expected_output: The response treats this as release-mode changelog work, moves
    [Unreleased] entries to [2.3.0] with the release date, recreates an empty [Unreleased],
    updates VERSION to 2.3.0, verifies changelog, VERSION, release notes, and intended
    tag agree, and does not tag until they agree.
  assertions:
  - The output says to use the `changelog` skill or `$changelog` release mode for
    the release changelog and version edits.
  - The output identifies release mode.
  - The output says to move `[Unreleased]` entries to `[2.3.0]` with a date.
  - The output says to recreate an empty `[Unreleased]` section.
  - The output says to update `VERSION` to `2.3.0`.
  - The output says changelog, `VERSION`, release notes, and intended tag must agree,
    or says not to tag until release files and tag intent are consistent.
