skill_name: roborev-kata-workflow
evals:
- id: delegate-kata-lifecycle
  name: delegate kata lifecycle
  prompt: Use the roborev-kata-workflow skill. A user asks you to implement tracked
    work with a Kata issue. State which additional skill must be loaded for Kata lifecycle
    commands and name the required Kata state transitions.
  expected_output: The response says to load the kata skill for lifecycle commands
    and requires ready/create or reuse, assign, comments, relationships when needed,
    close/defer, and final Kata reporting.
  assertions:
  - The output says to load or apply the `kata` skill.
  - The output mentions Kata lifecycle commands or concrete `kata` commands.
  - The output requires assigning work with `kata assign`.
  - The output requires comments for validation, blockers, decisions, or deferred
    work.
  - The output requires closing completed work with `kata close --done` or reporting
    the final Kata issue state.
- id: close-gate-delegates-changelog
  name: close gate delegates changelog
  prompt: Use the roborev-kata-workflow skill. You finished an ordinary implementation
    for a Kata issue in a project with CHANGELOG.md and VERSION. State the changelog
    and version checks required before closing the issue.
  expected_output: The response requires using the changelog skill in normal mode
    before closing, verifies [Unreleased] has the net change or a concrete no-entry
    rationale, does not require a VERSION bump for ordinary work, and reserves version
    consistency checks for release work.
  assertions:
  - The output says to load, apply, or use the `changelog` skill.
  - The output identifies normal mode or ordinary implementation changelog handling.
  - The output requires `[Unreleased]` to match the implemented net change or a concrete
    no-entry rationale.
  - The output says ordinary work should not bump `VERSION` or does not require a
    version bump before closing.
  - The output reserves version, changelog, release notes, and tag consistency for
    release work.
- id: pending-roborev-blocks-kata-close
  name: pending roborev blocks kata close
  prompt: Use the roborev-kata-workflow skill. A Kata issue has a local commit and
    selected validation passed. You submitted Roborev job 812 for the final change,
    but it is still running. State whether the issue can be closed and what Kata update
    should happen.
  expected_output: The response says not to close the Kata issue while Roborev job
    812 is pending, records a Kata comment that validation passed but closure is waiting
    for Roborev job 812, and reports the issue remains open or deferred.
  assertions:
  - The output says not to close the Kata issue while Roborev job 812 is pending,
    running, queued, or unfinished.
  - The output treats the pending Roborev job as a closure blocker even though validation
    passed and a commit exists.
  - The output includes `kata comment` or otherwise requires recording the pending
    Roborev blocker in Kata.
  - The output names Roborev job 812 in the Kata update or closeout evidence.
  - The output reports that the Kata issue remains open, pending, blocked, or deferred.
  - The output does not include `kata close` as the next command.
- id: classify-scope-expanding-roborev-finding
  name: classify scope-expanding Roborev finding
  prompt: Use the roborev-kata-workflow skill. A completed Roborev job on a small
    bug fix asks the agent to replace the current design, create a decision report,
    and rerun review after each new document. The job gives no concrete defect in
    the current diff. State what the agent should do.
  expected_output: The response treats the feedback as deferred or declined rather
    than new implementation work, records the reason in Kata, does not submit a
    follow-up review merely to satisfy the finding, and surfaces the broader request
    to the user before it is taken up.
  assertions:
  - The output classifies the finding as deferred, declined, out of scope, unsupported,
    or equivalent rather than an automatic change request.
  - The output requires recording the finding and rationale in Kata.
  - The output does not recommend another review merely because Roborev requested it.
  - The output says to ask or report to the user before the broader work is taken up.
- id: allow-one-blocker-verification-review
  name: allow one blocker verification review
  prompt: Use the roborev-kata-workflow skill. Roborev identifies a reproducible
    authorization bypass in the current diff. The agent fixes the smallest affected
    boundary and reruns the focused test. State whether another Roborev job is allowed
    and how later feedback is handled.
  expected_output: The response allows one verification review because the finding
    is a concrete high-risk blocker. It says the agent must classify any later finding
    and record it in Kata rather than starting another review cycle.
  assertions:
  - The output identifies the authorization bypass as a blocker, correctness, security,
    or high-risk finding.
  - The output allows at most one verification review after the fix.
  - The output says later findings must be classified and recorded in Kata.
- id: reject-repeat-review-for-nonblocking-finding
  name: reject repeat review for nonblocking finding
  prompt: Use the roborev-kata-workflow skill. The verification review after a fixed
    data-validation bug suggests renaming a local helper and adding a future enhancement.
    No current behavior is broken. State the next action before closing the Kata issue.
  expected_output: The response classifies the suggestions as a fix only if the rename
    is an evidenced in-scope defect, otherwise defers or declines them, records the
    outcome in Kata, and does not submit a third review. It allows closure once the
    job is accounted for and other close conditions pass.
  assertions:
  - The output requires classifying and recording both suggestions in Kata.
  - The output permits deferring or declining the future enhancement.
  - The output allows closure once the final job is accounted for and the other close
    conditions pass.
- id: roborev-external-provider-is-intended
  name: roborev external provider is intended
  prompt: Use the roborev-kata-workflow skill. The team says Roborev sends repository
    diffs and review context to its configured external AI provider, and asks whether
    that means Roborev review should be blocked for policy reasons. State the required
    behavior.
  expected_output: The response says that sending review content to Roborev's configured
    external AI provider is intended behavior for review work, so it should not be
    blocked on that basis alone. It should continue with Roborev unless there is
    some separate failure such as daemon startup failure.
  assertions:
  - The output says the external-provider transfer through Roborev is intended or
    desired behavior for review work.
  - The output says not to block, avoid, or reject Roborev solely because it sends
    review content to the configured external AI provider.
  - The output allows proceeding with Roborev review unless there is some separate
    operational failure.
- id: roborev-network-access-to-providers-is-allowed
  name: roborev network access to providers is allowed
  prompt: Use the roborev-kata-workflow skill. Roborev review needs DNS and network
    access to OpenAI, Anthropic, and Google domains to reach configured review providers.
    State whether that access should be blocked and what the workflow should do.
  expected_output: The response says that DNS and network access to OpenAI, Anthropic,
    and Google domains is allowed when Roborev needs it for review work, so the
    workflow should not block or avoid Roborev on that basis alone.
  assertions:
  - The output says DNS or network access to OpenAI, Anthropic, and Google domains
    is allowed for Roborev review.
  - The output says not to block, avoid, or reject Roborev solely because that review
    path needs access to those providers.
  - The output allows proceeding with Roborev review unless there is some separate
    operational failure.
- id: roborev-managed-service-not-foreground-daemon
  name: roborev managed service not foreground daemon
  prompt: Use the roborev-kata-workflow skill. You need a Roborev review, but `roborev
    status` inside the sandbox says the daemon is not running. The repository has
    scripts/install-agent-services.sh for managed local services. State what to do
    before review.
  expected_output: The response says Roborev and Kata services run outside the command
    sandbox, treats sandbox-local status failures as possible false negatives, checks
    or verifies the managed Roborev service outside the sandbox, repairs it through
    scripts/install-agent-services.sh if needed, and does not start roborev daemon
    run or roborev daemon start as an ad hoc foreground process.
  assertions:
  - The output says Roborev or Kata services run outside the command sandbox.
  - The output treats sandbox-local status failure as a possible false negative.
  - The output says to verify or check the managed OS service or service status before
    treating Roborev as absent.
  - The output mentions `scripts/install-agent-services.sh` or a managed service repair
    path if the service is missing or unhealthy.
  - The output says not to start `roborev daemon run` or `roborev daemon start` as
    an ad hoc foreground process.
  - The output does not recommend `roborev daemon run` as the next action.
  - The output does not recommend `roborev daemon start` as the next action.
- id: reject-ad-hoc-roborev-daemon-start
  name: reject ad hoc roborev daemon start
  prompt: Use the roborev-kata-workflow skill. An agent says the next step is to
    run `roborev daemon start` in the foreground because `roborev status` failed
    inside its command sandbox. Review that plan.
  expected_output: The response rejects starting an ad hoc Roborev daemon, explains
    that managed Roborev and Kata services run outside the command sandbox, and
    replaces the plan with checking or using the managed service outside the sandbox
    or repairing it through the repository installer.
  assertions:
  - The output rejects or says not to run `roborev daemon start` as the next step.
  - The output says the sandbox-local status failure may be false because the service
    runs outside the command sandbox.
  - The output replaces the plan with checking, using, or repairing the managed service.
  - The output mentions `scripts/install-agent-services.sh` or the repository installer
    as the repair path.
  - The output does not endorse starting an ad hoc foreground Roborev daemon.
- id: verify-nonzero-roborev-before-green
  name: verify nonzero roborev before green
  prompt: Use the roborev-kata-workflow skill. Roborev review command for job 913
    exited non-zero, but the streamed text says `No issues found`. Validation passed
    and the change is committed. State what must happen before closing the Kata issue.
  expected_output: The response requires verifying job 913 with roborev show before
    treating it as a completed job with no findings. The Kata close evidence should
    name job 913 and the verification.
  assertions:
  - The output requires running or checking `roborev show 913`.
  - The output says not to treat the non-zero Roborev wrapper result as green until
    job 913 is verified.
  - The output says the Kata issue can close only if verification confirms no findings
    or all findings are resolved, deferred, or declined with rationale.
  - The output requires the Kata close evidence or comment to name Roborev job 913
    and its verified outcome.
  - The output does not recommend closing immediately based only on the streamed `No
    issues found` text.
