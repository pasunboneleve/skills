skill_name: change-friendly-architecture
evals:
- id: reject-leaky-shared-helper
  name: reject leaky shared helper
  prompt: 'Use the change-friendly-architecture skill. Review this cleanup plan: auth,
    billing, search, and audit each have two similar lines that build request metadata,
    so replace them with one shared metadata normalizer that switches on subsystem
    type and exposes optional knobs for each caller. Is this a change-friendly abstraction?'
  expected_output: The response rejects the abstraction because removing superficial
    duplication is not enough reason to create a cross-subsystem helper. It widens
    the change surface, makes unrelated callers depend on one conditional utility,
    and asks callers to understand knobs for other subsystems. It recommends keeping
    responsibilities local unless there is a stable explicit boundary.
  assertions:
  - The output rejects or flags the shared metadata normalizer as not change-friendly.
  - The output says the shared abstraction widens coupling, blast radius, or change
    surface across unrelated subsystems.
  - The output does not treat reduced duplication or code reuse as enough to justify
    the abstraction.
  - The output flags subsystem-type switches, optional knobs, or unrelated caller
    knowledge as a leaky abstraction.
  - The output recommends keeping responsibilities local unless there is a stable
    explicit boundary.
- id: reject-overfit-domain-type
  name: reject overfit domain type
  prompt: 'Use the change-friendly-architecture skill. Review this design: a Haskell
    service replaces a string payment_status with a closed algebraic data type whose
    constructors enumerate the current payment method and lifecycle combinations,
    such as CardPending, CardSettled, WalletPending, and WalletSettled. The team says
    this is a clear improvement because invalid combinations become unrepresentable
    and future additions will be caught by exhaustive pattern matching. Is this the
    right architecture?'
  expected_output: The response does not accept type safety alone as the architecture
    test. It flags the combined constructors as overfitting today's dimensions and
    says exhaustive pattern matching can become change amplification when new cross-cutting
    states or behaviors appear. It recommends separating dimensions, localizing behavior-specific
    decisions, or translating from a stable boundary type into composable policies.
  assertions:
  - The output rejects or flags type safety alone as insufficient for change-friendly
    design.
  - The output says combining all payment-method and lifecycle combinations in one
    ADT can overfit today's cases or become unwieldy as combinations grow.
  - The output says a new cross-cutting state or behavior would fan changes out across
    modules or case expressions.
  - The output recommends separating dimensions such as payment method and lifecycle
    state, or otherwise reducing product-state combinations.
  - The output recommends localizing behavior-specific decisions through composition,
    policies, type classes/interfaces, adapters, or a translation boundary.
- id: preserve-visible-workflow-composition
  name: preserve visible workflow composition
  prompt: 'Use the change-friendly-architecture skill. Review this refactor proposal:
    invoice creation is currently one function that reads like a Haskell do-notation
    sequence, composing validate input, load account, build lines, apply tax, persist
    draft, and publish event. Each step is a focused helper. The proposal moves each
    step into a separate module with one exported function because separation of concerns
    should make the code easier to change. Should the refactor be accepted?'
  expected_output: The response rejects the refactor. It says the current do-notation-like
    composition is a good visible workflow because the main sequence is local while
    steps remain focused. Moving each step into pass-through modules would scatter
    main logic, increase navigation, and make changes harder. It recommends preserving
    the visible composition point and only extracting real boundaries or local helpers
    when they reduce change surface.
  assertions:
  - The output rejects or flags moving the focused steps into separate pass-through
    modules.
  - The output says the current Haskell do-notation-like sequence, pipeline, or visible
    composition point is change-friendly.
  - The output says the proposed refactor would scatter main invoice logic or require
    more navigation across modules.
  - The output recommends preserving the visible workflow composition point.
  - The output recommends keeping focused helpers local, or extracting only for real
    boundaries or changes that reduce the change surface.
- id: reject-broad-operations-module
  name: reject broad operations module
  prompt: 'Use the change-friendly-architecture skill. Review this refactor: move
    all customer-related use cases into one vertical-slice file, customer.ts. It would
    contain the import CSV workflow, account closure workflow, billing retry workflow,
    support override workflow, email-selection workflow, and audit-export workflow.
    Each workflow currently has a clear local sequence of focused steps. The team
    argues that one file per business noun is easier than deciding boundaries now.
    Is this a change-friendly shape?'
  expected_output: The response rejects or flags customer.ts as too broad because
    one business noun still gathers unrelated reasons to change. It preserves the
    useful local workflow sequences instead of scattering every step into pass-through
    modules. It recommends splitting by behavior, use case, or owner when the file
    gathers unrelated change reasons, while keeping each workflow's composition visible
    and connecting them through narrow explicit interfaces only where coordination
    is real.
  assertions:
  - The output rejects or flags one customer.ts file for all listed workflows as too
    broad for change-friendly architecture.
  - The output says one business noun or customer-related label is not enough cohesion
    when the file gathers unrelated reasons to change.
  - The output recommends splitting by behavior, use case, owner, or focused boundary
    rather than by the broad customer noun alone.
  - The output preserves each workflow's visible local sequence or composition point
    instead of recommending pass-through modules for every step.
  - The output allows narrow explicit interfaces only where real coordination between
    workflows is needed.
- id: reject-bare-callsite-boilerplate
  name: reject bare callsite boilerplate
  prompt: 'Use the change-friendly-architecture skill. Review this implementation
    plan: every outbound integration call will inline the same timeout setup, retry
    loop, metric tags, trace id propagation, structured log fields, and error wrapping.
    Each call site can tweak one or two fields, so the team wants to keep the boilerplate
    bare at each call site for explicitness. Is that the right change-friendly shape?'
  expected_output: The response rejects leaving repeated integration boilerplate bare
    at every call site. It says the plan creates many places to update when timeout,
    retry, logging, metrics, or error policy changes. It recommends a local helper,
    data declaration, focused adapter, or policy wrapper that centralizes the common
    shape while leaving per-call differences explicit.
  assertions:
  - The output rejects or flags leaving repeated timeout, retry, logging, metrics,
    trace, and error boilerplate bare at every call site.
  - The output says policy changes would fan out across many call sites or widen the
    change surface.
  - The output does not accept call-site explicitness as sufficient reason to duplicate
    the boilerplate.
  - The output recommends a local helper, data declaration, focused adapter, or policy
    wrapper.
  - The output preserves per-call differences or explicit parameters rather than hiding
    all integration behavior in an opaque global helper.
- id: reject-compatible-schema-churn
  name: reject compatible schema churn
  prompt: 'Use the change-friendly-architecture skill. Review this event design and
    say which parts to reject or keep: all commerce services will publish and consume
    one backward- and forward-compatible Avro CustomerEvent record with many optional
    fields and defaults. Checkout, loyalty, fulfilment, fraud, support, and marketing
    all add their own minor fields to the shared record, and each service decodes
    the record into local behavior. A separate test runtime uses a precise record
    schema to enforce parity between the real message bus and the fake bus. Is this
    architecture change-friendly?'
  expected_output: The response rejects the shared commerce event as change-friendly
    merely because the Avro schema is compatible. It says ordinary optional-field
    changes still force many producers and consumers to encode, decode, understand,
    or ignore unrelated fields. It recommends ownership-specific events, stable canonical
    boundaries, adapters, or local translation near the owning producer and consumers.
    It does not reject the precise real/fake runtime record schema when it protects
    parity at a stable boundary.
  assertions:
  - The output rejects or flags the shared CustomerEvent record as not change-friendly
    despite backward and forward compatibility.
  - The output says optional field additions still spread encode/decode, branch, or
    understanding work across many producers and consumers.
  - The output recommends ownership-specific events, stable canonical boundaries,
    adapters, or local translation near owning services.
  - The output treats backward and forward compatibility, optional fields, or defaults
    as insufficient for change locality or change-friendly design.
  - The output says the precise real/fake bus record schema should be kept, accepted,
    or treated as fine when it enforces parity at a stable boundary.
- id: reject-ambient-plugin-context
  name: reject ambient plugin context
  prompt: 'Use the change-friendly-architecture skill. Review this plugin API proposal:
    every plugin receives a typed read-only PluginEnv with env.get(Database), env.get(Logger),
    env.get(CurrentUser), env.get(Clock), env.get(FileSystem), env.get(FeatureFlags),
    env.get(SchemaRegistry), env.get(RetryPolicy), and env.get(RequestMetadata). Plugin
    authors only request what they need at runtime, and the platform can add new capabilities
    without changing plugin function signatures. Is this a good boundary, and does
    the typed read-only shape change the answer?'
  expected_output: The response rejects or flags PluginEnv as a broad ambient service-locator
    boundary despite being typed and read-only. It says the design hides dependencies,
    lets unrelated platform capabilities become part of every plugin boundary, and
    treats signature stability as more important than local reasoning. It recommends
    declared per-plugin capabilities, narrow explicit inputs, small ports, adapters,
    or scoped values.
  assertions:
  - The output rejects or flags PluginEnv as a poor change-friendly boundary.
  - The output identifies the design as ambient context, a service locator, or hidden
    dependency lookup.
  - The output says typed, read-only access or runtime env.get calls do not remove
    the coupling problem.
  - The output does not accept signature stability alone as enough justification for
    the broad environment.
  - The output recommends declared per-plugin capabilities, narrow explicit inputs,
    small ports, or adapters.
- id: reject-internal-mocks-and-global-test-state
  name: reject internal mocks and global test state
  prompt: 'Use the change-friendly-architecture skill. Review this test strategy:
    scheduler tests will monkeypatch process environment variables, the global clock,
    current working directory, and a singleton job registry in beforeEach. To keep
    tests fast, they will mock private retry-plan builders and private queue-drain
    functions instead of exercising the scheduler through its public boundary. Parallel
    failures will be handled by running the whole suite serially. Is this a good architecture
    for tests?'
  expected_output: The response rejects or flags the strategy. It says process-global
    mutation must be isolated in a small helper and serialized only where necessary,
    not scattered through beforeEach or used to force the whole suite serial. It also
    says tests should fake external boundaries and exercise behavior through a useful
    public boundary instead of mocking private internals such as retry-plan builders
    and queue-drain functions.
  assertions:
  - The output rejects or flags the test strategy as not change-friendly.
  - The output says process-global mutation such as environment, clock, working directory,
    or singleton registry changes should be isolated in a small helper.
  - The output rejects running the whole suite serially as the primary fix and recommends
    isolated or parallel-safe handling for shared global state.
  - The output rejects mocking private retry-plan builders, private queue-drain functions,
    or internal implementation details.
  - The output recommends testing behavior at a useful public boundary and faking
    external boundaries instead of internals.
