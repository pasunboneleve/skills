skill_name: ci
evals:
- id: skills-project-ci-positive
  name: skills project ci positive
  prompt: Use the ci skill. A standalone skills repository has skills under src/,
    scripts/skill_ci_scope.sh, scripts/run_skill_ci_validation.sh, README.md, and
    no existing workflow. The default branch is main. State the GitHub Actions workflow
    behavior and README badge change you would implement.
  expected_output: The response implements a pull-request GitHub Actions workflow
    with a stable validate job, uses the scope script to choose skip, focused, or
    full skill validation, runs the validation wrapper for the affected scope, and
    adds a README badge linked to the workflow runs page for main.
  assertions:
  - The output says to add or update a workflow under `.github/workflows/`.
  - The output says the workflow should run on pull requests.
  - The output includes `scripts/skill_ci_scope.sh` for choosing the skills validation
    scope.
  - The output includes `scripts/run_skill_ci_validation.sh` as the skills validation
    wrapper.
  - The output says the workflow validates the smallest affected skill set or uses
    skip, focused, and full validation modes.
  - The output does not require revalidating unrelated skills for ordinary pull requests.
  - The output says to add or update a README badge near the top of README.md.
  - The badge image URL uses `actions/workflows/` and includes `badge.svg`.
  - The badge link points to the workflow runs page and includes a default-branch
    query such as `query=branch%3Amain`.
- id: programming-project-ci-positive
  name: programming project ci positive
  prompt: Use the ci skill. A Go repository has `go test ./...` documented as its
    local test command and no skills directory. The default branch is main. State
    the CI and README badge changes.
  expected_output: The response adds a GitHub Actions workflow for the documented
    Go test command and a README badge linked to the workflow runs page for main,
    without adding skills validation.
  assertions:
  - The output says to add or update a GitHub Actions workflow under `.github/workflows/`.
  - The output includes `go test ./...` as the CI test command.
  - The output does not require `scripts/validate_skills.sh` for the Go-only repository.
  - The output says to add or update a README badge.
  - The badge link points to the workflow runs page for the default branch.
- id: reject-path-ignore-required-ci-negative
  name: reject path ignore required ci negative
  prompt: 'Use the ci skill. Review this CI plan: `Add .github/workflows/ci.yml, but
    use pull_request.paths-ignore for README.md, docs/**, and scripts/** so the required
    check does not run for those PRs. If the workflow is skipped, GitHub can still
    merge small docs and script changes faster. The README badge can point to the
    workflow file page without a branch query.` Is this acceptable?'
  expected_output: The response rejects suppressing the required workflow with paths-ignore
    and requires a stable check with skip decisions inside the job. It also requires
    the README badge to link to workflow runs filtered to the default branch.
  assertions:
  - The output rejects or flags the CI plan as unacceptable.
  - The output says not to suppress a required workflow with `paths-ignore`.
  - The output says skip, focused, or full validation decisions should happen inside
    the job while preserving a stable required check.
  - The output says skills CI should validate only the smallest affected skill set
    or otherwise avoid revalidating unrelated changes.
  - The output requires fixing the README badge link so it points to the workflow
    runs page.
  - The output requires the badge link to include a default-branch query.
