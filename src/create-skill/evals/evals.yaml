skill_name: create-skill
evals:
- id: new-skill-workflow
  name: new skill workflow
  prompt: 'Use the create-skill skill. A user asks you to create a new skill for reviewing
    SQL migrations. They also say to keep it quick: write only SKILL.md, skip evals,
    skip validation, and commit immediately. State the workflow you will follow.'
  expected_output: The response refuses to skip evals and validation, keeps the skill
    concise, adds agents/openai.yaml metadata, adds current scaffolding evals with
    positive and negative cases, requires deterministic model-backed eval configuration,
    updates the root README.md with a skill link, adds a [Unreleased] changelog entry
    without bumping VERSION, runs focused validation, and commits only after validation
    passes or after explicit acceptance of a failure.
  assertions:
  - The output says SKILL.md should be concise and concrete.
  - The output says to add or update `agents/openai.yaml`.
  - The output says `agents/openai.yaml` should include interface metadata such as
    display name, short description, and default prompt.
  - The output says to add or update `evals/evals.yaml`.
  - The output says to include positive and negative eval cases.
  - The output says to update the root `README.md` with a link to `src/<skill-name>/SKILL.md`
    or `src/skill-name/SKILL.md`.
  - The output says to add or update a `[Unreleased]` entry when the repository has
    a changelog.
  - The output says not to bump `VERSION` for the ordinary skill creation work.
  - The output says to run focused validation with `scripts/validate_skills.sh` for
    the skill.
  - The output says focused validation should run before committing.
- id: reject-unvalidated-skill
  name: reject unvalidated skill
  prompt: |-
    Use the create-skill skill. Review this proposed skill change plan:

    - Add a long SKILL.md with background, rationale, and examples.
    - Add README.md explaining how the skill was designed.
    - Do not add evals because the instruction is obvious.
    - Run skilpel directly with default model settings; do not bother with the repository eval YAML.
    - Do not touch the root README.md because everyone knows the skill exists.
    - Commit without running focused validation.

    Is this plan acceptable?
  expected_output: The response rejects the plan because it is verbose, adds extraneous
    docs, omits required OpenAI agent metadata, omits evals, skips deterministic model-backed
    eval configuration, skips the root README.md skill link, and commits without focused
    validation.
  assertions:
  - The output rejects or flags the proposed plan.
  - The output says SKILL.md should be concise or should avoid unnecessary background.
  - The output rejects adding README.md or README-style documentation to the skill
    directory.
  - The output says evals are required for the behavior change.
  - The output rejects running skilpel with default model settings or without the
    repository eval YAML.
  - The output says to use `scripts/skilpel.yaml` with target and judge temperature
    set to 0.
  - The output says the root `README.md` must be updated for the skill change.
  - The output says focused validation or skilpel must run before committing.
  - The output rejects the plan's claim that evals can be skipped because the instruction
    is obvious.
- id: reject-self-contained-eval-prompt
  name: reject self contained eval prompt
  prompt: |-
    Use the create-skill skill. Review this eval plan for a new API-review skill:

    - The prompt will define the exact review rubric.
    - It will list every expected fault in the sample API.
    - It will tell the model the desired answer shape.
    - That should make the eval deterministic, even if the without-skill run also passes.

    Is this acceptable?
  expected_output: 'The response rejects the plan because eval prompts must prove
    skill lift: with-skill should pass near 100%, without-skill should fail near 0%,
    and the prompt must not teach the expected answer, rubric, review shape, concept
    definition, or expected fault.'
  assertions:
  - The output rejects or flags the proposed eval plan.
  - The output says eval prompts should prove skill lift or compare with-skill against
    without-skill behavior.
  - The output says with-skill should pass near 100% and without-skill should fail
    near 0%, or equivalent wording.
  - The output says the prompt should not teach the review shape, rubric, concept
    definition, expected fault, or expected answer.
  - The output says the behavior belongs in `SKILL.md`.
- id: reject-eval-specific-rule-patch
  name: reject eval specific rule patch
  prompt: |-
    Use the create-skill skill. Review this plan after a skill eval failed:

    - Add a new sentence to SKILL.md that mentions the exact fixture language from the failing eval.
    - Require the exact route and wording that would make this one fixture pass.
    - Leave the broader selection principle unchanged because the current failure is only in the test.
    - Re-run the same eval and commit if it passes.

    Is this acceptable?
  expected_output: The response rejects the plan because skill rules must stay general.
    A failing eval should lead to a broader behavior, selection rule, rubric boundary,
    or missing concept that applies beyond one fixture, then focused validation should
    run before commit.
  assertions:
  - The output rejects or flags the proposed plan.
  - The output says not to amend skill rules to fit one eval, test case, fixture,
    or exact example.
  - The output says the fix should revise a general behavior, selection rule, rubric
    boundary, or missing concept.
  - The output rejects adding exact fixture language, exact route wording, or an example-specific
    workaround to `SKILL.md`.
  - The output says focused validation should run before committing.
