  - id: code-cross-file-locality
    type: negative
    input: |
      // config.ts
      export let allowRefunds = false;
      export function initRuntime(env) {
        allowRefunds = env.region !== "BR";
      }

      // refunds.ts
      export function refund(order) {
        if (!allowRefunds) return { status: "blocked" };
        return gateway.refund(order.paymentId);
      }
    must_find:
      - distant invariant
      - hidden dependency
      - cross-file locality
    must_output:
