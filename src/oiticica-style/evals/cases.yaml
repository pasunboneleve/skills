  - id: multiple-fault-resolution
    type: negative
    input: |
      export function process(data) {
        if (CONFIG.enabled && data.items.length > 0) {
          return data.items.map(x => doThing(x));
        }
      }
    must_find:
      - vague name
      - hidden dependency
      - missing empty result contract
    must_output:
      - Spine
      - Main faults
      - Representative contrast
      - Weak
      - Fault
      - Better
      - Why
      - Rubric
      - Final version

  - id: final-version-scope
    type: negative_control
    input: |
      Main faults:
      - Vague name: `process` hides the payment mutation.
      - Hidden dependency: `CONFIG.enabled` controls behavior from outside the function.
      - Missing empty result contract: no branch states what happens for no items.

      Better:
      `chargeItems(items)`
    must_fail_because:
      - final version fixes only one named fault
      - hidden dependency remains unresolved
      - missing result contract remains unresolved

